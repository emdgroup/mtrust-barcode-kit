name: Dev - 🚧 publish package

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-[0-9]+"
  workflow_dispatch:

jobs:
  publish:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    environment: "pub.dev"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{secrets.ELEVATED_TOKEN}}

      - name: Publish mtrust_barcode_kit
        uses: ./.github/actions/publish-pub-dev
        with:
          publish_mode: --force
          flutter_version: ${{ vars.FLUTTER_VERSION }}
